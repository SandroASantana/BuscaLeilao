[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "buscaleilao"
version = "0.1.0"
description = "Agregador e buscador de lotes de leilões de veículos"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
    "beautifulsoup4>=4.11",
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.24"]
diagnostico = ["playwright>=1.40"]

[project.scripts]
buscaleilao = "buscaleilao.cli:main"

[tool.setuptools.packages.find]
include = ["buscaleilao*"]

[tool.setuptools.package-data]
buscaleilao = ["web/templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
